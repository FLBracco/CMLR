services:
  # ---------- API ----------
  - type: web
    name: cmlr-api
    runtime: node
    plan: free
    region: oregon
    branch: main
    rootDir: . # raíz: el lockfile es del workspace pnpm, no de backend/
    buildCommand: pnpm install --frozen-lockfile && pnpm --filter backend build
    startCommand: pnpm --filter backend migration:run:prod && pnpm --filter backend seed:admin:prod && pnpm --filter backend start
    healthCheckPath: /api/hello
    envVars:
      - key: NODE_ENV
        value: production
      - key: TZ
        value: America/Argentina/Buenos_Aires
      - key: JWT_EXPIRES_IN
        value: 12h
      - key: DATABASE_PORT
        value: 5432
      - key: DATABASE_NAME
        value: neondb
      - key: DATABASE_SSL
        value: true
      - key: DATABASE_HOST
        sync: false
      - key: DATABASE_USER
        sync: false
      - key: DATABASE_PASSWORD
        sync: false
      - key: JWT_SECRET
        sync: false
      - key: SUPERADMIN_EMAIL
        sync: false
      - key: SUPERADMIN_PASSWORD
        sync: false
      - key: CORS_ORIGIN
        sync: false

  # ---------- Frontend ----------
  - type: web
    name: cmlr-web
    runtime: static
    branch: main
    rootDir: .
    buildCommand: pnpm install --frozen-lockfile && pnpm --filter frontend build
    staticPublishPath: ./frontend/dist
    envVars:
      - key: VITE_API_URL
        sync: false
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
